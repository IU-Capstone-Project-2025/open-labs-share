syntax = "proto3";

option java_multiple_files = true;
option java_package = "olsh.backend.grpc.auth";
option java_outer_classname = "AuthServiceOuterClass";

package auth;

service AuthService {
  // Validate JWT token and return user information - used by API Gateway
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse) {}
  
  // Health check endpoint
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse) {}
}

// Request to validate JWT token
message ValidateTokenRequest {
  string token = 1;
}

// Response containing validation result and user information
message ValidateTokenResponse {
  bool isValid = 1;
  UserInfo userInfo = 2;
  int64 expiresAt = 3;
  string errorMessage = 4;
}

// User information model
message UserInfo {
  int64 userId = 1;
  string username = 2;
  string firstName = 3;
  string lastName = 4;
  string role = 5;
  string email = 6;
  int32 labsSolved = 7;
  int32 labsReviewed = 8;
  double balance = 9;
}

// Health check request
message HealthCheckRequest {
  // Empty request
}

// Health check response
message HealthCheckResponse {
  bool success = 1;
  string message = 2;
  HealthData data = 3;

  message HealthData {
    string timestamp = 1;
    string service = 2;
    string version = 3;
  }
} 